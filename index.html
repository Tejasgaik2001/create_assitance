  <!-- Safari: polyfill requestIdleCallback (React scheduler needs it) -->
  <script>
    var isMobileDevice = /iphone|ipad|ipod|android/i.test(navigator.userAgent);

    if (!window.requestIdleCallback) {
      if (isMobileDevice) {
        // Mobile: skip idle scheduling entirely — synchronous is faster on limited CPU
        window.requestIdleCallback = function (cb) {
          return setTimeout(function () {
            cb({ didTimeout: true, timeRemaining: function () { return 0; } });
          }, 0);
        };
      } else {
        // Desktop Safari: throttled polyfill
        window.requestIdleCallback = function (cb, options) {
          var timeout = (options && options.timeout) || 50;
          return setTimeout(function () {
            var start = Date.now();
            cb({
              didTimeout: false,
              timeRemaining: function () {
                return Math.max(0, timeout - (Date.now() - start));
              }
            });
          }, timeout);
        };
      }
    }
    if (!window.cancelIdleCallback) {
      window.cancelIdleCallback = function (id) {
        clearTimeout(id);
      };
    }
    // Safari: prevent scroll blocking during JS execution
    document.addEventListener('touchstart', function () { }, { passive: true });
  </script>
